name: quadrim
description: "Quadrim - four in a row inside a 4x4x4 cube."
publish_to: 'none'
# <name>+<code>, and the two halves answer to different masters (D358).
#
# The name is for people and may say anything; the code is a ratchet and must
# only ever increase. **A build number is spent the moment it is uploaded** --
# even to a closed track, even if that release is discarded -- so the code is
# raised on every upload and never reused. One counter serves both stores
# (D359): it is raised for an upload to either, and neither store cares that
# the other skipped a number. That rule is the whole point of not reasoning
# about whether a given delivery "counted" -- +3 met a rejection whose warning
# text says uploads continue until Spring 2027, so it may or may not be spent,
# and raising costs nothing where guessing wrong costs a rejection (D362).
version: 0.1.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  in_app_purchase: ^3.3.0
  intl: any
  path_provider: ^2.1.5
  quadrim_engine:
    path: ../packages/quadrim_engine
  quadrim_progression:
    path: ../packages/quadrim_progression
  quadrim_rating:
    path: ../packages/quadrim_rating

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Produced by `python tools/artgen/artgen.py` from doc/designs/ (D290).
  # Declared by directory: adding an opponent's portrait is dropping a file in,
  # and `art_assets_test.dart` is what notices when one is missing.
  assets:
    - assets/art/
    - assets/art/opponents/
    # The two OFL licence files. Bundled as assets rather than left on disk
    # because the licence requires them to travel with the fonts, and only
    # what is declared here ends up inside the APK.
    - assets/fonts/

  # Cinzel and EB Garamond, SIL OFL 1.1, instanced to the weights used and
  # subset to Latin by artgen. Licences ship beside them in assets/fonts/.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
