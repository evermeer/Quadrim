name: quadrim
description: "Quadrim - four in a row inside a 4x4x4 cube."
publish_to: 'none'
# <name>+<code>, and the two halves answer to different masters (D358).
#
# The name is for people and may say anything; the code is a ratchet and must
# only ever increase. **A build number is spent the moment it is uploaded** --
# even to a closed track, even if that release is discarded -- so the code is
# raised on every upload and never reused. One counter serves both stores
# (D359): it is raised for an upload to either, and neither store cares that
# the other skipped a number. +5 reached App Store Connect and +6 renamed the
# two purchase products (D365). +7 was built with the tutorial's cube intro
# *and* its corner posts, and the posts came straight back out (D366); the
# bundle left the machine, so whether that number is spent is not knowable from
# here. +8 was handed over as a bundle too, and the same reasoning applies to
# it for the same reason -- so +9 is the one that ships. **The rule is not
# "raise it when the last one was definitely uploaded"**; it is "raise it when
# the last one might have been", because the two mistakes cost different
# amounts: a skipped number costs nothing at all, and a reused one is a
# rejected upload.
#
# The name moves to 0.1.3 because the cube board is a whole second way to look
# at a game (D369), and a build that cannot be told apart from the one already
# installed is a support question waiting to happen.
#
# **And then to 0.2.0, which is the first bump of the middle number** (D387).
# 0.1.x has meant "the game, being finished"; this build adds Play Games
# Services and Game Center -- a leaderboard, forty-six achievements and a
# sign-in -- which is a capability the version in the App Store does not have
# at all, rather than a better version of one it does. That is what the middle
# number is for, and leaving it at 0.1.4 would have said "some fixes" about a
# release a player will notice the moment they open it.
#
# **+12 because +11 is spent**, and spent twice over: it is the bundle in the
# Play closed test *and* the build in the App Store. Worse, the two are not the
# same code -- +11 was built from `release/0.1.3`, which still stripped
# INTERNET from the merged manifest, which is why the store reads as
# unavailable on Android (D388). So +11 names two different artefacts already
# and must never name a third.
version: 0.2.0+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  games_services: ^5.3.0
  in_app_purchase: ^3.3.0
  intl: any
  path_provider: ^2.1.5
  # Opens the privacy policy, the EULA and the support page in the browser.
  # **It needs no INTERNET permission** and must not introduce one: launching a
  # VIEW intent hands the address to another app, and this bundle still strips
  # INTERNET from the merge (D357). check.sh reads the merged manifest, so a
  # transitive declaration would fail the gate rather than ship (D384).
  url_launcher: ^6.3.1
  quadrim_engine:
    path: ../packages/quadrim_engine
  quadrim_progression:
    path: ../packages/quadrim_progression
  quadrim_rating:
    path: ../packages/quadrim_rating

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Produced by `python tools/artgen/artgen.py` from doc/designs/ (D290).
  # Declared by directory: adding an opponent's portrait is dropping a file in,
  # and `art_assets_test.dart` is what notices when one is missing.
  assets:
    - assets/art/
    - assets/art/opponents/
    # The two OFL licence files. Bundled as assets rather than left on disk
    # because the licence requires them to travel with the fonts, and only
    # what is declared here ends up inside the APK.
    - assets/fonts/

  # Cinzel and EB Garamond, SIL OFL 1.1, instanced to the weights used and
  # subset to Latin by artgen. Licences ship beside them in assets/fonts/.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
